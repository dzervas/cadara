services:
  frontend:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    volumes:
      - .:/app
    command: bun run dev --host 0.0.0.0 --port 3000

  debug-browser:
    image: ghcr.io/browserless/chromium
    init: true
    depends_on:
      - frontend
    environment:
      TOKEN: cadara-local-debug
      CONCURRENT: "2"
      QUEUED: "2"
      TIMEOUT: "-1"
    ports:
      - "127.0.0.1:9222:3000"
